[project]
name = "empty-room"
version = "0.1.0"
description = "A séance over a sensor log: TabPFN finds the presences, local Gemma speaks for them and then explains them away."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.39.0",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "sentry-sdk>=2",
]

[project.scripts]
empty-room = "empty_room:main"

[project.optional-dependencies]
model = [
    "tabpfn>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
